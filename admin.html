<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LubEasy — Admin</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2176c7">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
body { background:#f0f4f8; min-height:100vh; }

header {
  background: linear-gradient(135deg, #0d2b4e, #1a4f8a);
  color:#fff;
  padding: 16px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
header h1 { font-size:20px; font-weight:800; }
.btn-sair {
  background:rgba(255,255,255,0.15);
  color:#fff;
  border:none;
  padding:8px 16px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
}
.btn-sair:hover { background:rgba(255,255,255,0.25); }

.container { max-width:960px; margin:0 auto; padding:24px 16px; }

.form-card {
  background:#fff;
  border-radius:16px;
  padding:24px;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
  margin-bottom:24px;
}
.form-card h2 {
  font-size:18px;
  color:#0d2b4e;
  margin-bottom:20px;
  font-weight:700;
}
.form-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.form-group { display:flex; flex-direction:column; gap:6px; }
.form-group.full { grid-column:1/-1; }
label { font-size:13px; font-weight:600; color:#444; }
input, textarea {
  padding:10px 14px;
  border:1.5px solid #ddd;
  border-radius:8px;
  font-size:14px;
  color:#333;
  outline:none;
  transition:border 0.2s;
  font-family:'Segoe UI',sans-serif;
}
input:focus, textarea:focus { border-color:#2176c7; }
textarea { resize:vertical; min-height:80px; }

.btn-row {
  display:flex;
  gap:12px;
  margin-top:20px;
}
.btn-salvar {
  flex:1;
  padding:14px;
  background:#2176c7;
  color:#fff;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  transition:background 0.2s;
}
.btn-salvar:hover { background:#1a5fa0; }
.btn-salvar:disabled { background:#aaa; cursor:not-allowed; }
.btn-cancelar {
  padding:14px 24px;
  background:#f0f4f8;
  color:#555;
  border:none;
  border-radius:10px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  display:none;
}
.btn-cancelar:hover { background:#e0e8f0; }

.modo-edicao .form-card {
  border: 2px solid #f39c12;
}
.modo-edicao .form-card h2 {
  color: #f39c12;
}

.toast {
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  background:#1e8449;
  color:#fff;
  padding:12px 28px;
  border-radius:10px;
  font-weight:600;
  font-size:15px;
  opacity:0;
  transition:opacity 0.3s;
  z-index:999;
  pointer-events:none;
  white-space:nowrap;
}
.toast.show { opacity:1; }
.toast.erro { background:#c0392b; }
.toast.aviso { background:#f39c12; }

.tabela-card {
  background:#fff;
  border-radius:16px;
  padding:24px;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
}
.tabela-card h2 {
  font-size:18px;
  color:#0d2b4e;
  margin-bottom:16px;
  font-weight:700;
}

.filtros {
  display:flex;
  gap:12px;
  margin-bottom:16px;
  flex-wrap:wrap;
}
.busca {
  flex:1;
  min-width:200px;
  padding:10px 14px;
  border:1.5px solid #ddd;
  border-radius:8px;
  font-size:14px;
  outline:none;
}
.busca:focus { border-color:#2176c7; }

select.filtro-equip {
  padding:10px 14px;
  border:1.5px solid #ddd;
  border-radius:8px;
  font-size:14px;
  outline:none;
  color:#333;
  background:#fff;
  cursor:pointer;
  min-width:200px;
}
select.filtro-equip:focus { border-color:#2176c7; }

.badge-total {
  background:#f0f4f8;
  color:#0d2b4e;
  padding:6px 14px;
  border-radius:20px;
  font-size:13px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:6px;
}

table { width:100%; border-collapse:collapse; font-size:14px; }
th {
  background:#0d2b4e;
  color:#fff;
  padding:12px 10px;
  text-align:left;
  font-weight:600;
}
th:first-child { border-radius:8px 0 0 0; }
th:last-child { border-radius:0 8px 0 0; }
td { padding:11px 10px; border-bottom:1px solid #f0f0f0; color:#333; vertical-align:middle; }
tr:hover td { background:#f8faff; }

.acoes { display:flex; gap:6px; }
.btn-edit {
  background:#eaf4ff;
  color:#2176c7;
  border:none;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
}
.btn-edit:hover { background:#c8e3ff; }
.btn-del {
  background:#fdecea;
  color:#c0392b;
  border:none;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
  font-weight:600;
}
.btn-del:hover { background:#f5c6c6; }

.vazio { text-align:center; color:#aaa; padding:32px; font-size:15px; }
.loading { text-align:center; color:#888; padding:24px; font-size:15px; }

@media(max-width:600px) {
  .form-grid { grid-template-columns:1fr; }
  table { font-size:12px; }
  th, td { padding:8px 6px; }
  .filtros { flex-direction:column; }
  select.filtro-equip { min-width:100%; }
}
</style>
</head>
<body>

<header>
  <h1>🛢️ LubEasy — Admin</h1>
  <button class="btn-sair" onclick="sair()">🚪 Sair</button>
</header>

<div class="container" id="container">

  <!-- FORMULÁRIO -->
  <div class="form-card">
    <h2 id="form-titulo">➕ Cadastrar Equipamento</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Equipamento *</label>
        <input type="text" id="equipamento" placeholder="Ex: Motor Elétrico">
      </div>
      <div class="form-group">
        <label>Fabricante</label>
        <input type="text" id="fabricante" placeholder="Ex: WEG">
      </div>
      <div class="form-group">
        <label>Ponto de Lubrificação *</label>
        <input type="text" id="ponto" placeholder="Ex: Rolamento dianteiro">
      </div>
      <div class="form-group">
        <label>Lubrificante *</label>
        <input type="text" id="lubrificante" placeholder="Ex: Grease MP NLGI 2">
      </div>
      <div class="form-group">
        <label>Quantidade</label>
        <input type="text" id="quantidade" placeholder="Ex: 20g">
      </div>
      <div class="form-group">
        <label>Frequência</label>
        <input type="text" id="frequencia" placeholder="Ex: A cada 3 meses">
      </div>
      <div class="form-group full">
        <label>Observações</label>
        <textarea id="observacoes"
          placeholder="Ex: Limpar o ponto antes de lubrificar"></textarea>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-salvar" id="btnSalvar" onclick="salvar()">
        💾 Salvar Equipamento
      </button>
      <button class="btn-cancelar" id="btnCancelar" onclick="cancelarEdicao()">
        ✖ Cancelar
      </button>
    </div>
  </div>

  <!-- TABELA -->
  <div class="tabela-card">
    <h2>📋 Equipamentos Cadastrados</h2>

    <div class="filtros">
      <input class="busca" type="text" id="busca"
        placeholder="🔍 Buscar..." oninput="filtrar()">
      <select class="filtro-equip" id="filtro-equip" onchange="filtrar()">
        <option value="">🏭 Todos os equipamentos</option>
      </select>
      <div class="badge-total">
        📦 <span id="total">0</span> registros
      </div>
    </div>

    <div style="overflow-x:auto">
      <div id="tabela-container">
        <div class="loading">⏳ Carregando...</div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, deleteDoc,
  doc, onSnapshot, orderBy, query, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCLBmCWxiV5n7cNg6NNQVkGKHmMmhY2yDM",
  authDomain: "lubeasy-c75be.firebaseapp.com",
  projectId: "lubeasy-c75be",
  storageBucket: "lubeasy-c75be.firebasestorage.app",
  messagingSenderId: "128335451883",
  appId: "1:128335451883:web:a8f4ca7afee4ad900b90ae"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let todosRegistros = [];
let idEditando = null;

// ✅ VERIFICAR LOGIN
if (!sessionStorage.getItem('lubeasy_sessao')) {
  window.location.href = 'login.html';
}

// ✅ CARREGAR DADOS EM TEMPO REAL
const q = query(collection(db, "equipamentos"), orderBy("equipamento"));
onSnapshot(q, (snapshot) => {
  todosRegistros = [];
  snapshot.forEach((d) => {
    todosRegistros.push({ id: d.id, ...d.data() });
  });
  atualizarFiltroEquip();
  filtrar();
}, (error) => {
  console.error("Erro Firestore:", error);
  mostrarToast('❌ Erro ao carregar dados!', true);
});

// ✅ ATUALIZAR DROPDOWN DE EQUIPAMENTOS
function atualizarFiltroEquip() {
  const select = document.getElementById('filtro-equip');
  const valorAtual = select.value;

  // Pega equipamentos únicos
  const equipamentos = [...new Set(
    todosRegistros.map(r => r.equipamento)
  )].sort();

  select.innerHTML = '<option value="">🏭 Todos os equipamentos</option>';
  equipamentos.forEach(eq => {
    const opt = document.createElement('option');
    opt.value = eq;
    opt.textContent = eq;
    if (eq === valorAtual) opt.selected = true;
    select.appendChild(opt);
  });
}

// ✅ FILTRAR
window.filtrar = function() {
  const termo = document.getElementById('busca').value.toLowerCase();
  const equipSelecionado = document.getElementById('filtro-equip').value;

  let filtrados = todosRegistros;

  // Filtro por equipamento
  if (equipSelecionado) {
    filtrados = filtrados.filter(r => r.equipamento === equipSelecionado);
  }

  // Filtro por busca
  if (termo) {
    filtrados = filtrados.filter(r =>
      r.equipamento.toLowerCase().includes(termo) ||
      (r.ponto && r.ponto.toLowerCase().includes(termo)) ||
      (r.lubrificante && r.lubrificante.toLowerCase().includes(termo)) ||
      (r.fabricante && r.fabricante.toLowerCase().includes(termo))
    );
  }

  document.getElementById('total').textContent = filtrados.length;
  renderTabela(filtrados);
}

// ✅ SALVAR OU EDITAR
window.salvar = async function() {
  const equipamento  = document.getElementById('equipamento').value.trim();
  const ponto        = document.getElementById('ponto').value.trim();
  const lubrificante = document.getElementById('lubrificante').value.trim();

  if (!equipamento || !ponto || !lubrificante) {
    mostrarToast('⚠️ Preencha os campos obrigatórios!', false, true);
    return;
  }

  const btn = document.getElementById('btnSalvar');
  btn.disabled = true;
  btn.textContent = '⏳ Salvando...';

  const dados = {
    equipamento,
    fabricante:  document.getElementById('fabricante').value.trim(),
    ponto,
    lubrificante,
    quantidade:  document.getElementById('quantidade').value.trim(),
    frequencia:  document.getElementById('frequencia').value.trim(),
    observacoes: document.getElementById('observacoes').value.trim(),
  };

  try {
    if (idEditando) {
      // ✅ MODO EDIÇÃO
      await updateDoc(doc(db, "equipamentos", idEditando), dados);
      mostrarToast('✏️ Registro atualizado com sucesso!');
      cancelarEdicao();
    } else {
      // ✅ MODO CADASTRO
      dados.criadoEm = new Date().toISOString();
      await addDoc(collection(db, "equipamentos"), dados);
      mostrarToast('✅ Equipamento salvo com sucesso!');
      limparForm();
    }
  } catch(e) {
    console.error("Erro ao salvar:", e);
    mostrarToast('❌ Erro: ' + e.message, true);
  }

  btn.disabled = false;
  btn.textContent = idEditando ? '💾 Atualizar' : '💾 Salvar Equipamento';
}

// ✅ EDITAR
window.editar = function(id) {
  const r = todosRegistros.find(x => x.id === id);
  if (!r) return;

  idEditando = id;

  // Preenche o formulário
  document.getElementById('equipamento').value = r.equipamento || '';
  document.getElementById('fabricante').value  = r.fabricante  || '';
  document.getElementById('ponto').value        = r.ponto       || '';
  document.getElementById('lubrificante').value = r.lubrificante|| '';
  document.getElementById('quantidade').value   = r.quantidade  || '';
  document.getElementById('frequencia').value   = r.frequencia  || '';
  document.getElementById('observacoes').value  = r.observacoes || '';

  // Muda visual do formulário
  document.getElementById('form-titulo').textContent = '✏️ Editando Registro';
  document.getElementById('btnSalvar').textContent = '💾 Atualizar';
  document.getElementById('btnCancelar').style.display = 'block';
  document.getElementById('container').classList.add('modo-edicao');

  // Scroll para o topo
  window.scrollTo({ top: 0, behavior: 'smooth' });

  mostrarToast('✏️ Modo edição ativado!', false, true);
}

// ✅ CANCELAR EDIÇÃO
window.cancelarEdicao = function() {
  idEditando = null;
  limparForm();
  document.getElementById('form-titulo').textContent = '➕ Cadastrar Equipamento';
  document.getElementById('btnSalvar').textContent = '💾 Salvar Equipamento';
  document.getElementById('btnCancelar').style.display = 'none';
  document.getElementById('container').classList.remove('modo-edicao');
}

// ✅ DELETAR
window.deletar = async function(id) {
  if (!confirm('Deseja excluir este equipamento?')) return;
  try {
    await deleteDoc(doc(db, "equipamentos", id));
    mostrarToast('🗑️ Excluído com sucesso!');
  } catch(e) {
    mostrarToast('❌ Erro ao excluir!', true);
  }
}

// ✅ RENDERIZAR TABELA
function renderTabela(registros) {
  const container = document.getElementById('tabela-container');
  if (registros.length === 0) {
    container.innerHTML =
      '<div class="vazio">📭 Nenhum equipamento encontrado</div>';
    return;
  }
  container.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Equipamento</th>
          <th>Fabricante</th>
          <th>Ponto</th>
          <th>Lubrificante</th>
          <th>Qtd</th>
          <th>Frequência</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        ${registros.map(r => `
          <tr>
            <td><strong>${r.equipamento}</strong></td>
            <td>${r.fabricante || '—'}</td>
            <td>${r.ponto}</td>
            <td>${r.lubrificante}</td>
            <td>${r.quantidade || '—'}</td>
            <td>${r.frequencia || '—'}</td>
            <td>
              <div class="acoes">
                <button class="btn-edit" onclick="editar('${r.id}')">
                  ✏️ Editar
                </button>
                <button class="btn-del" onclick="deletar('${r.id}')">
                  🗑️
                </button>
              </div>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

// ✅ LIMPAR FORMULÁRIO
function limparForm() {
  ['equipamento','fabricante','ponto','lubrificante',
   'quantidade','frequencia','observacoes']
    .forEach(id => document.getElementById(id).value = '');
}

// ✅ TOAST
function mostrarToast(msg, erro = false, aviso = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' +
    (erro ? ' erro' : '') +
    (aviso ? ' aviso' : '');
  setTimeout(() => t.className = 'toast', 3500);
}

// ✅ SAIR
window.sair = function() {
  sessionStorage.removeItem('lubeasy_sessao');
  window.location.href = 'login.html';
}
</script>

</body>
</html>
