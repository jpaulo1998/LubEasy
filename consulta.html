<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LubEasy — Consulta</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2176c7">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
body { background:#f0f4f8; min-height:100vh; }

header {
  background: linear-gradient(135deg, #0d2b4e, #1a4f8a);
  color:#fff;
  padding:16px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
header h1 { font-size:20px; font-weight:800; }
.btn-voltar {
  background:rgba(255,255,255,0.15);
  color:#fff;
  border:none;
  padding:8px 16px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  text-decoration:none;
}

.container { max-width:960px; margin:0 auto; padding:24px 16px; }

.busca-card {
  background:#fff;
  border-radius:16px;
  padding:20px 24px;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
  margin-bottom:24px;
}
.busca-card input {
  width:100%;
  padding:12px 16px;
  border:1.5px solid #ddd;
  border-radius:10px;
  font-size:15px;
  outline:none;
}
.busca-card input:focus { border-color:#2176c7; }

.resultado-card {
  background:#fff;
  border-radius:16px;
  padding:24px;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
}
.resultado-card h2 {
  font-size:18px;
  color:#0d2b4e;
  margin-bottom:16px;
  font-weight:700;
}

.cards-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
  gap:16px;
}

.equip-card {
  background:#f8faff;
  border:1.5px solid #e0e8f5;
  border-radius:12px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.equip-card h3 {
  font-size:16px;
  color:#0d2b4e;
  font-weight:700;
}
.equip-card .badge {
  display:inline-block;
  background:#e8f0fe;
  color:#2176c7;
  padding:3px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
  width:fit-content;
}
.equip-card .linha {
  display:flex;
  gap:8px;
  font-size:13px;
  color:#555;
  align-items:flex-start;
}
.equip-card .linha strong {
  color:#333;
  min-width:90px;
  font-weight:600;
}
.vazio {
  text-align:center;
  color:#aaa;
  padding:40px;
  font-size:15px;
}
.loading {
  text-align:center;
  color:#888;
  padding:32px;
  font-size:15px;
}
.contador {
  font-size:13px;
  color:#888;
  margin-bottom:16px;
}

@media(max-width:560px) {
  .cards-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<header>
  <h1>🔍 LubEasy — Consulta</h1>
  <a href="index.html" class="btn-voltar">🏠 Início</a>
</header>

<div class="container">

  <div class="busca-card">
    <input type="text" id="busca" placeholder="🔍 Buscar por equipamento, ponto ou lubrificante..." oninput="filtrar()">
  </div>

  <div class="resultado-card">
    <h2>📋 Equipamentos</h2>
    <div class="contador" id="contador"></div>
    <div id="resultado">
      <div class="loading">⏳ Carregando equipamentos...</div>
    </div>
  </div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCLBmCWxiV5n7cNg6NNQVkGKHmMmhY2yDM",
  authDomain: "lubeasy-c75be.firebaseapp.com",
  projectId: "lubeasy-c75be",
  storageBucket: "lubeasy-c75be.firebasestorage.app",
  messagingSenderId: "128335451883",
  appId: "1:128335451883:web:a8f4ca7afee4ad900b90ae"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let todosRegistros = [];

// CARREGAR DADOS EM TEMPO REAL
const q = query(collection(db, "equipamentos"), orderBy("equipamento"));
onSnapshot(q, (snapshot) => {
  todosRegistros = [];
  snapshot.forEach((doc) => {
    todosRegistros.push({ id: doc.id, ...doc.data() });
  });
  renderCards(todosRegistros);
});

// FILTRAR
window.filtrar = function() {
  const termo = document.getElementById('busca').value.toLowerCase();
  const filtrados = todosRegistros.filter(r =>
    r.equipamento.toLowerCase().includes(termo) ||
    (r.ponto && r.ponto.toLowerCase().includes(termo)) ||
    (r.lubrificante && r.lubrificante.toLowerCase().includes(termo)) ||
    (r.fabricante && r.fabricante.toLowerCase().includes(termo))
  );
  renderCards(filtrados);
}

// RENDERIZAR CARDS
function renderCards(registros) {
  const container = document.getElementById('resultado');
  const contador = document.getElementById('contador');

  contador.textContent = `${registros.length} equipamento(s) encontrado(s)`;

  if (registros.length === 0) {
    container.innerHTML = '<div class="vazio">📭 Nenhum equipamento encontrado</div>';
    return;
  }

  container.innerHTML = `
    <div class="cards-grid">
      ${registros.map(r => `
        <div class="equip-card">
          <h3>⚙️ ${r.equipamento}</h3>
          ${r.fabricante ? `<span class="badge">🏭 ${r.fabricante}</span>` : ''}
          <div class="linha"><strong>📍 Ponto:</strong> ${r.ponto}</div>
          <div class="linha"><strong>🛢️ Lubrificante:</strong> ${r.lubrificante}</div>
          ${r.quantidade ? `<div class="linha"><strong>⚖️ Quantidade:</strong> ${r.quantidade}</div>` : ''}
          ${r.frequencia ? `<div class="linha"><strong>🗓️ Frequência:</strong> ${r.frequencia}</div>` : ''}
          ${r.observacoes ? `<div class="linha"><strong>📝 Obs:</strong> ${r.observacoes}</div>` : ''}
        </div>
      `).join('')}
    </div>
  `;
}
</script>

</body>
</html>
