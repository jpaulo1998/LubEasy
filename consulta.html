<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LubEasy — Consulta</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2176c7">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
body {
  background: linear-gradient(135deg, #0d2b4e, #1a4f8a);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  gap: 20px;
}
header {
  width: 100%;
  max-width: 700px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
header h1 {
  color: #fff;
  font-size: 22px;
  font-weight: 800;
}
.btn-voltar {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border: none;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
}
.btn-voltar:hover { background: rgba(255,255,255,0.25); }

.busca-card {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  width: 100%;
  max-width: 700px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.busca-input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
  outline: none;
  color: #333;
}
.busca-input:focus { border-color: #2176c7; }

.resultados {
  width: 100%;
  max-width: 700px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.12);
}
.card-titulo {
  font-size: 17px;
  font-weight: 700;
  color: #0d2b4e;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.card-item label {
  font-size: 11px;
  font-weight: 700;
  color: #888;
  text-transform: uppercase;
  display: block;
  margin-bottom: 2px;
}
.card-item span {
  font-size: 14px;
  color: #222;
  font-weight: 500;
}
.card-obs {
  margin-top: 10px;
  padding: 10px;
  background: #f0f4f8;
  border-radius: 8px;
  font-size: 13px;
  color: #555;
}

.vazio {
  background: #fff;
  border-radius: 16px;
  padding: 40px;
  text-align: center;
  color: #aaa;
  font-size: 15px;
  width: 100%;
  max-width: 700px;
}
.loading {
  color: #fff;
  font-size: 16px;
  padding: 20px;
  text-align: center;
}

footer {
  color: rgba(255,255,255,0.4);
  font-size: 12px;
  text-align: center;
  padding-bottom: 10px;
}
</style>
</head>
<body>

<header>
  <h1>🛢️ LubEasy</h1>
  <a class="btn-voltar" href="index.html">← Voltar</a>
</header>

<div class="busca-card">
  <input class="busca-input" type="text" id="busca"
    placeholder="🔍 Buscar equipamento, ponto ou lubrificante..."
    oninput="filtrar()">
</div>

<div class="resultados" id="resultados">
  <div class="loading">⏳ Carregando equipamentos...</div>
</div>

<footer>© 2026 LubEasy</footer>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, onSnapshot, orderBy, query
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCLBmCWxiV5n7cNg6NNQVkGKHmMmhY2yDM",
  authDomain: "lubeasy-c75be.firebaseapp.com",
  projectId: "lubeasy-c75be",
  storageBucket: "lubeasy-c75be.firebasestorage.app",
  messagingSenderId: "128335451883",
  appId: "1:128335451883:web:a8f4ca7afee4ad900b90ae"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let todosRegistros = [];

// ✅ CARREGAR DADOS EM TEMPO REAL
const q = query(collection(db, "equipamentos"), orderBy("equipamento"));
onSnapshot(q, (snapshot) => {
  todosRegistros = [];
  snapshot.forEach((d) => {
    todosRegistros.push({ id: d.id, ...d.data() });
  });
  filtrar();
}, (error) => {
  console.error("Erro:", error);
  document.getElementById('resultados').innerHTML =
    '<div class="vazio">❌ Erro ao carregar dados!</div>';
});

// ✅ FILTRAR
window.filtrar = function() {
  const termo = document.getElementById('busca').value.toLowerCase();
  const filtrados = termo
    ? todosRegistros.filter(r =>
        r.equipamento.toLowerCase().includes(termo) ||
        (r.ponto && r.ponto.toLowerCase().includes(termo)) ||
        (r.lubrificante && r.lubrificante.toLowerCase().includes(termo)) ||
        (r.fabricante && r.fabricante.toLowerCase().includes(termo))
      )
    : todosRegistros;
  renderCards(filtrados);
}

// ✅ RENDERIZAR CARDS
function renderCards(registros) {
  const container = document.getElementById('resultados');

  if (registros.length === 0) {
    container.innerHTML =
      '<div class="vazio">📭 Nenhum equipamento encontrado</div>';
    return;
  }

  container.innerHTML = registros.map(r => `
    <div class="card">
      <div class="card-titulo">
        🔧 ${r.equipamento}
        ${r.fabricante ? `<span style="font-size:13px;color:#888;font-weight:400">
          — ${r.fabricante}</span>` : ''}
      </div>
      <div class="card-grid">
        <div class="card-item">
          <label>📍 Ponto</label>
          <span>${r.ponto || '—'}</span>
        </div>
        <div class="card-item">
          <label>🛢️ Lubrificante</label>
          <span>${r.lubrificante || '—'}</span>
        </div>
        <div class="card-item">
          <label>⚖️ Quantidade</label>
          <span>${r.quantidade || '—'}</span>
        </div>
        <div class="card-item">
          <label>📅 Frequência</label>
          <span>${r.frequencia || '—'}</span>
        </div>
      </div>
      ${r.observacoes ? `
        <div class="card-obs">
          📝 ${r.observacoes}
        </div>` : ''}
    </div>
  `).join('');
}
</script>

</body>
</html>
