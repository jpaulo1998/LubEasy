<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- PWA -->
<link rel="manifest" href="/LubEasy/manifest.json">
<link rel="icon" href="/LubEasy/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2176c7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LubEasy">
<title>LubEasy</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <div class="container-home">

    <!-- LOGO / HEADER -->
    <div class="home-header">
      <i class="fa-solid fa-oil-can icon-logo"></i>
      <h1>LubEasy</h1>
      <p>Sistema de Consulta de Lubrificação</p>
    </div>

    <!-- CARDS DE OPÇÃO -->
    <div class="home-cards">

      <!-- CONSULTA -->
      <a href="consulta.html" class="card card-consulta">
        <i class="fa-solid fa-magnifying-glass"></i>
        <h2>Consulta</h2>
        <p>Consulte os lubrificantes dos equipamentos</p>
      </a>

      <!-- ADMIN -->
      <a href="login.html" class="card card-admin">
        <i class="fa-solid fa-user-shield"></i>
        <h2>Administrador</h2>
        <p>Acesso restrito ao painel de gestão</p>
      </a>

    </div>

    <!-- FOOTER -->
    <footer>
      <p>&copy; 2026 LubEasy — Todos os direitos reservados</p>
    </footer>

  </div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/LubEasy/service-worker.js')
      .then(function(reg) {
        console.log('SW registrado!', reg);
      }).catch(function(err) {
        console.log('SW erro:', err);
      });
  });
}
</script>
</body>
</html>
