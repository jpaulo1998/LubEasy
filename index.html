<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LubEasy</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2176c7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LubEasy">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }

  body {
    background: linear-gradient(135deg, #0d2b4e, #1a4f8a);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 32px;
  }

  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: #fff;
    text-align: center;
  }

  .logo-icon {
    font-size: 72px;
    line-height: 1;
  }

  .logo h1 {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #fff;
  }

  .logo p {
    font-size: 15px;
    color: rgba(255,255,255,0.75);
  }

  .cards {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 680px;
  }

  .card {
    background: #fff;
    border-radius: 20px;
    padding: 36px 28px;
    flex: 1;
    min-width: 260px;
    max-width: 300px;
    text-align: center;
    text-decoration: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    transition: transform 0.2s;
  }

  .card:hover { transform: translateY(-6px); }
  .card:active { transform: scale(0.97); }

  .card-icon {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
  }

  .card-icon.azul { background: #e8f0fe; }
  .card-icon.verde { background: #e8f8f0; }

  .card h2 {
    font-size: 22px;
    color: #0d2b4e;
    font-weight: 700;
  }

  .card p {
    font-size: 14px;
    color: #666;
    line-height: 1.6;
  }

  .card-btn {
    margin-top: 8px;
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: #fff;
  }

  .card-btn.azul { background: #2176c7; }
  .card-btn.verde { background: #1e8449; }

  footer {
    color: rgba(255,255,255,0.45);
    font-size: 13px;
    text-align: center;
  }

  @media(max-width: 560px) {
    .cards {
      flex-direction: column;
      align-items: center;
    }
    .card {
      max-width: 100%;
      width: 100%;
    }
    .logo h1 { font-size: 30px; }
  }
</style>
</head>
<body>

<!-- LOGO -->
<div class="logo">
  <div class="logo-icon">🛢️</div>
  <h1>LubEasy</h1>
  <p>Sistema de Consulta de Lubrificação</p>
</div>

<!-- CARDS -->
<div class="cards">

  <a href="consulta.html" class="card">
    <div class="card-icon azul">🔍</div>
    <h2>Consulta</h2>
    <p>Consulte os lubrificantes recomendados para cada equipamento</p>
    <span class="card-btn azul">▶ Acessar</span>
  </a>

  <a href="login.html" class="card">
    <div class="card-icon verde">🔐</div>
    <h2>Administrador</h2>
    <p>Acesso restrito ao painel de gestão e cadastro de equipamentos</p>
    <span class="card-btn verde">🔒 Entrar</span>
  </a>

</div>

<footer>© 2026 LubEasy — Todos os direitos reservados</footer>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('service-worker.js')
      .then(function(reg) { console.log('SW OK', reg); })
      .catch(function(err) { console.log('SW erro', err); });
  });
}
</script>

</body>
</html>
