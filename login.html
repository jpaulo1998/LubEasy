<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LubEasy Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
body {
  background: linear-gradient(135deg, #0d2b4e, #1a4f8a);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  gap: 24px;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  max-width: 460px;
}
.btn-voltar {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #fff;
  text-decoration: none;
  font-size: 14px;
  background: rgba(255,255,255,0.15);
  padding: 8px 16px;
  border-radius: 8px;
}
.btn-voltar:hover { background: rgba(255,255,255,0.28); }
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
  font-size: 22px;
  font-weight: 700;
}
.box {
  background: #fff;
  border-radius: 16px;
  padding: 40px;
  max-width: 460px;
  width: 100%;
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}
.box-header {
  text-align: center;
  margin-bottom: 28px;
}
.box-header i {
  font-size: 52px;
  color: #1a4f8a;
  display: block;
  margin-bottom: 12px;
}
.box-header h2 {
  font-size: 22px;
  color: #0d2b4e;
  margin-bottom: 6px;
}
.box-header p {
  font-size: 14px;
  color: #555;
}
.grupo {
  margin-bottom: 20px;
}
.grupo label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  color: #0d2b4e;
  margin-bottom: 8px;
}
.grupo input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid #d0dce8;
  border-radius: 10px;
  font-size: 15px;
  color: #0d2b4e;
  background: #f0f4f8;
  outline: none;
}
.grupo input:focus { border-color: #2176c7; }
.senha-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}
.senha-wrapper input { padding-right: 48px; }
.btn-olho {
  position: absolute;
  right: 12px;
  background: none;
  border: none;
  cursor: pointer;
  color: #555;
  font-size: 16px;
}
.erro {
  display: none;
  align-items: center;
  gap: 8px;
  background: #fdecea;
  border: 1px solid #f5c6cb;
  border-radius: 8px;
  padding: 10px 14px;
  color: #c0392b;
  font-size: 14px;
  margin-bottom: 16px;
}
.btn-entrar {
  width: 100%;
  padding: 14px;
  background: #2176c7;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 8px;
}
.btn-entrar:hover { background: #1a5fa3; }
footer {
  color: rgba(255,255,255,0.6);
  font-size: 13px;
  text-align: center;
}
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="btn-voltar">
    <i class="fa-solid fa-arrow-left"></i> Voltar
  </a>
  <div class="logo">
    <i class="fa-solid fa-oil-can"></i>
    LubEasy
  </div>
  <span></span>
</div>

<div class="box">
  <div class="box-header">
    <i class="fa-solid fa-user-shield"></i>
    <h2>Acesso Administrativo</h2>
    <p>Digite suas credenciais para continuar</p>
  </div>

  <form id="form-login" onsubmit="fazerLogin(event)">

    <div class="grupo">
      <label for="input-usuario">
        <i class="fa-solid fa-user"></i> Usuário
      </label>
      <input
        type="text"
        id="input-usuario"
        placeholder="Digite seu usuário"
        autocomplete="username"
        required
      >
    </div>

    <div class="grupo">
      <label for="input-senha">
        <i class="fa-solid fa-lock"></i> Senha
      </label>
      <div class="senha-wrapper">
        <input
          type="password"
          id="input-senha"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        >
        <button type="button" class="btn-olho" onclick="toggleSenha()">
          <i class="fa-solid fa-eye" id="icone-olho"></i>
        </button>
      </div>
    </div>

    <div class="erro" id="msg-erro">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="texto-erro">Usuário ou senha incorretos.</span>
    </div>

    <button type="submit" class="btn-entrar">
      <i class="fa-solid fa-right-to-bracket"></i> Entrar
    </button>

  </form>
</div>

<footer>
  <p>&copy; 2026 LubEasy — Todos os direitos reservados</p>
</footer>

<script>
function getUsuarios() {
  const dados = localStorage.getItem('lubeasy_usuarios');
  return dados ? JSON.parse(dados) : [];
}

function gerarId() {
  return '_' + Math.random().toString(36).substr(2, 9);
}

function inicializarMaster() {
  const usuarios = getUsuarios();
  if (usuarios.length === 0) {
    const master = {
      id:      gerarId(),
      usuario: '553815',
      senha:   '105950@Djs',
      perfil:  'master',
      ativo:   true
    };
    localStorage.setItem('lubeasy_usuarios', JSON.stringify([master]));
    console.log('Master criado!');
  }
}

function fazerLogin(event) {
  event.preventDefault();
  const usuario  = document.getElementById('input-usuario').value.trim();
  const senha    = document.getElementById('input-senha').value.trim();
  const msgErro  = document.getElementById('msg-erro');
  const txtErro  = document.getElementById('texto-erro');
  const usuarios = getUsuarios();

  console.log('Tentando login:', usuario, senha);
  console.log('Usuarios:', usuarios);

  const encontrado = usuarios.find(
    u => u.usuario === usuario && u.senha === senha && u.ativo === true
  );

  if (encontrado) {
    const sessao = {
      id:      encontrado.id,
      usuario: encontrado.usuario,
      perfil:  encontrado.perfil,
      hora:    new Date().toISOString()
    };
    sessionStorage.setItem('lubeasy_sessao', JSON.stringify(sessao));
    window.location.href = 'admin.html';
  } else {
    txtErro.textContent    = 'Usuário ou senha incorretos.';
    msgErro.style.display  = 'flex';
    document.getElementById('input-senha').value = '';
    document.getElementById('input-senha').focus();
  }
}

function toggleSenha() {
  const input = document.getElementById('input-senha');
  const icone = document.getElementById('icone-olho');
  if (input.type === 'password') {
    input.type      = 'text';
    icone.className = 'fa-solid fa-eye-slash';
  } else {
    input.type      = 'password';
    icone.className = 'fa-solid fa-eye';
  }
}

inicializarMaster();
</script>
</body>
</html>
